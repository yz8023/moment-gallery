plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moment.gallery'
    compileSdk 34

    defaultConfig {
        applicationId "com.moment.gallery"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 纯 framework API，没有任何第三方依赖
}
